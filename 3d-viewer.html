<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Viewer</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
/* =============================================
   СБРОС И БАЗОВЫЕ СТИЛИ
============================================= */
*{ margin:0; padding:0; box-sizing:border-box; }
body{ overflow:hidden; background:#EBEBEB; font-family:Inter,sans-serif; }
#viewer{ width:100vw; height:100vh; }

/* =============================================
   ЭКРАН ЗАГРУЗКИ
============================================= */
.loading-screen{
    position:fixed; inset:0;
    background:#EBEBEB;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    z-index:1000;
}
.loading-screen.hidden{ opacity:0; pointer-events:none; }

.loader{
    width:60px; height:60px; border-radius:50%;
    border:4px solid rgba(0,0,0,0.08);
    border-top:4px solid #009746;
    animation:spin 1s linear infinite;
}
@keyframes spin{ 100%{ transform:rotate(360deg); } }

/* =============================================
   ЭКРАН ОШИБКИ
============================================= */
.error-screen{
    position:fixed; inset:0;
    display:none;
    align-items:center; justify-content:center; flex-direction:column;
    background:#EBEBEB;
    z-index:2000;
}
.error-screen.active{ display:flex; }

.error-title{ color:#2B2A29; font-size:28px; margin-bottom:10px; }
.error-text{ color:#888; font-size:16px; margin-bottom:20px; }

.retry-btn{
    width:180px; height:52px;
    border:none; border-radius:14px;
    background:#009746;
    color:white; font-size:16px; font-weight:700;
    cursor:pointer;
    margin-bottom:10px;
}

/* =============================================
   ИНТЕРФЕЙС ПРОСМОТРЩИКА (КНОПКИ, ПОДСКАЗКИ)
============================================= */
.viewer-ui{
    position:fixed; top:20px; left:20px; right:20px;
    display:flex; justify-content:space-between;
    z-index:100;
}

.viewer-title{
    padding:14px 20px;
    border-radius:14px;
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(10px);
    color:#2B2A29; font-size:18px; font-weight:600;
}

.buttons{ display:flex; gap:10px; }

.btn{
    width:48px; height:48px;
    border:none; border-radius:14px;
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(10px);
    color:#2B2A29;
    cursor:pointer;
    font-size:18px;
    transition:0.2s;
}

.btn:hover{ background:rgba(255,255,255,0.9); }

/* Подсказка по управлению мышью */
.bottom-info{
    position:fixed; left:50%; bottom:20px;
    transform:translateX(-50%);
    padding:12px 20px;
    border-radius:14px;
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(10px);
    color:#555; font-size:13px;
    white-space:nowrap;
}
</style>

</head>
<body>

<!-- ЭКРАН ЗАГРУЗКИ -->
<div class="loading-screen" id="loadingScreen">
    <div class="loader"></div>
</div>

<!-- ЭКРАН ОШИБКИ -->
<div class="error-screen" id="errorScreen">
    <div class="error-title">Ошибка загрузки</div>
    <div class="error-text">Не удалось загрузить 3D модель</div>
    <button class="retry-btn" onclick="location.reload()">Повторить</button>
</div>

<!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
<div class="viewer-ui">
    <div class="viewer-title">3D модель</div>
    <div class="buttons">
        <button class="btn" id="fullscreenBtn">⛶</button>
        <button class="btn" id="resetBtn">↺</button>
    </div>
</div>

<!-- ПОДСКАЗКА ПО УПРАВЛЕНИЮ -->
<div class="bottom-info">
    ЛКМ вращение · ПКМ перемещение · колесо масштаб
</div>

<!-- КОНТЕЙНЕР ДЛЯ THREE.JS -->
<div id="viewer"></div>

<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

/* =============================================
   ПАРАМЕТРЫ URL
============================================= */
const params = new URLSearchParams(location.search);
const modelPath = params.get('model');

/* =============================================
   СОХРАНЁННАЯ ПОЗИЦИЯ КАМЕРЫ (ДЛЯ СБРОСА)
============================================= */
let savedCameraPosition = new THREE.Vector3();
let savedTarget = new THREE.Vector3();

/* =============================================
   СЦЕНА
============================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xEBEBEB);

/* =============================================
   КАМЕРА
============================================= */
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(4, 3, 6);

/* =============================================
   РЕНДЕРЕР
============================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9; 
renderer.shadowMap.enabled = true;
document.getElementById('viewer').appendChild(renderer.domElement);

/* =============================================
   ОСВЕЩЕНИЕ
============================================= */
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(10, 10, 10);
scene.add(sun);

/* =============================================
   ПОЛ
============================================= */
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 100),
    new THREE.MeshStandardMaterial({ color: 0xD8D8D8 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

/* =============================================
   УПРАВЛЕНИЕ ОРБИТОЙ
============================================= */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

/* =============================================
   HDR ОКРУЖЕНИЕ
============================================= 
const pmrem = new THREE.PMREMGenerator(renderer);

new RGBELoader().load(
    'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr',
    (tex) => {
        const env = pmrem.fromEquirectangular(tex).texture;
        scene.environment = env;
        scene.environmentIntensity = 0.8;
        tex.dispose();
    }
); */

/* =============================================
   ЗАГРУЗКА 3D МОДЕЛИ
============================================= */
const loader = new GLTFLoader();

loader.load(
    modelPath,

    (gltf) => {
        const model = gltf.scene;
        scene.add(model);

        // Включаем тени для всех мешей модели
        model.traverse(o => {
            if (o.isMesh) {
                o.castShadow = true;
                o.receiveShadow = true;
            }
        });

        // Центрирование модели
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        model.position.sub(center);

        // Ставим модель на пол
        const box2 = new THREE.Box3().setFromObject(model);
        model.position.y -= box2.min.y;

        // Позиция камеры относительно размера модели
        const max = Math.max(size.x, size.y, size.z);
        const radius = max * 1.5;

        camera.position.set(-radius, max * 1.1, -radius);

        // Сохраняем начальную позицию для кнопки «сброс»
        savedCameraPosition.copy(camera.position);
        savedTarget.copy(controls.target);

        controls.update();

        document.getElementById('loadingScreen').classList.add('hidden');
    },

    undefined,

    (error) => {
        console.error(error);
        document.getElementById('errorScreen').classList.add('active');
        document.getElementById('loadingScreen').classList.add('hidden');
    }
);

/* =============================================
   КНОПКА ПОЛНОЭКРАННОГО РЕЖИМА
============================================= */
document.getElementById('fullscreenBtn').onclick = () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
};

/* =============================================
   КНОПКА СБРОСА КАМЕРЫ
============================================= */
document.getElementById('resetBtn').onclick = () => {
    camera.position.set(
        savedCameraPosition.x,
        savedCameraPosition.y,
        savedCameraPosition.z
    );
    controls.target.set(
        savedTarget.x,
        savedTarget.y,
        savedTarget.z
    );
    controls.update();
};

/* =============================================
   АДАПТАЦИЯ ПРИ ИЗМЕНЕНИИ РАЗМЕРА ОКНА
============================================= */
window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

/* =============================================
   ЦИКЛ РЕНДЕРИНГА
============================================= */
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

</script>

</body>
</html>
